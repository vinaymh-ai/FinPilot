# One-click deploy on Render's free tier: New → Blueprint → point at this repo.
# Free instances sleep when idle and have an ephemeral disk; the demo account is re-seeded on boot.
services:
  - type: web
    name: finpilot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MESH_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: mesh
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SCHEDULER_ENABLED
        value: "true"
