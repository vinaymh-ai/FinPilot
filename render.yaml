# One-click deploy on Render's free tier: New → Blueprint → point at this repo.
# Free instances sleep when idle and have an ephemeral disk: accounts and data reset on restart unless
# DATABASE_URL points at a hosted Postgres (Neon / Supabase free tiers). Visitors use "Try the demo".
services:
  - type: web
    name: finpilot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MESH_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: mesh
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: AUTH_ENABLED
        value: "true"
      - key: ADMIN_EMAILS
        sync: false
      # Render's proxy sets X-Forwarded-For/-Proto: trust it so rate limits and Secure cookies see the client
      - key: FORWARDED_ALLOW_IPS
        value: "*"
