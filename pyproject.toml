# Tooling configuration. Runtime dependencies live in requirements.txt.
[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["frontend", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # import `finpilot` from the repo root when running bare `pytest` (as CI does)
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
